<!doctype html>
<html lang="zh-Hant">
<head>
  <!-- auth-gateway:start -->
  <style>html.auth-pending{visibility:hidden}</style>
  <script>document.documentElement.classList.add("auth-pending")</script>
  <script src="https://site-auth-gateway.cloudflare-authgateway.workers.dev/auth-check.js" data-site="FSG2300LogAnalysis" defer></script>
  <!-- auth-gateway:end -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSG2300 Log Analysis</title>
  <style>
    :root {
      color-scheme: light;
      --top: #f5f7fa;
      --info: #dce6f5;
      --tab: #ebebeb;
      --line: #b9c4d1;
      --grid: #e5eaf0;
      --text: #20242a;
      --muted: #505a66;
      --blue: #0072c6;
      --g1: #0072bd;
      --g2: #2fa84f;
      --c3: #d95319;
      --purple: #503c8c;
      --orange: #b45014;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    .app { height: 100vh; display: grid; grid-template-rows: 58px 24px minmax(0, 1fr); }
    .topbar {
      position: relative;
      height: 58px;
      padding: 8px 6px 4px;
      background: var(--top);
      border-bottom: 1px solid #d5dde7;
      overflow: hidden;
    }
    .mainbtn {
      position: absolute;
      top: 8px;
      width: 138px;
      height: 42px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18);
    }
    #btnBatch { left: 6px; background: #0066cc; }
    #btnWafer { left: 151px; background: #008c46; }
    #btnPPT { left: 300px; background: #b45014; }
    #btnS1Peak { left: 444px; background: #7c3aed; }
    #btnPPT:disabled { filter: grayscale(.7); opacity: .55; cursor: not-allowed; }
    .langbtn {
      position: absolute;
      top: 14px;
      width: 58px;
      height: 26px;
      border: 1px solid #a8b4c2;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .langbtn.active { background: #0072c6; border-color: #0072c6; color: #fff; }
    #btnLangZhTW { left: 588px; }
    #btnLangZhCN { left: 650px; }
    #btnLangEn { left: 712px; }
    #btnAbout {
      position: absolute;
      left: 774px;
      top: 14px;
      width: 28px;
      height: 26px;
      border: 1px solid #788caa;
      border-radius: 3px;
      background: #c8d2e1;
      color: #323250;
      font-weight: 900;
      cursor: pointer;
    }
    #lblPath {
      position: absolute;
      left: 806px;
      right: 104px;
      top: 14px;
      height: 30px;
      display: flex;
      align-items: center;
      color: #505050;
      font: 13px Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #lblVersion {
      position: absolute;
      right: 12px;
      top: 18px;
      width: 80px;
      height: 20px;
      color: #828ca0;
      text-align: right;
      font: 12px Consolas, monospace;
    }
    .info {
      height: 24px;
      display: flex;
      align-items: center;
      padding-left: 6px;
      background: var(--info);
      font: 13px Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tabs {
      height: 100%;
      display: grid;
      grid-template-rows: 31px minmax(0, 1fr);
      min-width: 0;
      background: #fff;
    }
    .tabstrip {
      display: flex;
      align-items: end;
      gap: 0;
      padding: 6px 4px 0;
      border-bottom: 1px solid #8fa4bd;
      background: #f4f4f4;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .tab {
      width: 95px;
      height: 24px;
      flex: 0 0 95px;
      border: 1px solid #aaa;
      border-bottom: 0;
      background: var(--tab);
      color: #222;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab.active {
      background: var(--blue);
      color: #fff;
      border-color: #0065ad;
    }
    .page { display: none; height: 100%; min-height: 0; overflow: hidden; }
    .page.active { display: block; }
    .fill { width: 100%; height: 100%; }
    .split-v { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) 172px; }
    .split-half { height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .split-half > * + * { border-top: 1px solid #c8d0da; }
    .ctrlbar {
      height: 36px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 6px;
      background: #f0f3f8;
      border-bottom: 1px solid #d3dbe5;
      overflow-x: auto;
    }
    .toggle {
      height: 26px;
      min-width: 90px;
      padding: 0 9px;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: #fff;
      color: var(--g1);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .toggle input { vertical-align: -2px; }
    .toggle.c2 { color: var(--g2); }
    .toggle.c3 { color: var(--c3); }
    .toggle.purple { color: var(--purple); }
    .tablewrap { width: 100%; height: 100%; overflow: auto; background: #fff; }
    table { border-collapse: collapse; width: 100%; font: 14px Consolas, "Microsoft JhengHei", monospace; }
    th, td { border: 1px solid #d6dce4; padding: 5px 7px; white-space: nowrap; text-align: left; }
    th { background: #eef2f7; color: #35445a; position: sticky; top: 0; z-index: 2; }
    .chartbox { width: 100%; height: 100%; min-height: 0; position: relative; overflow: hidden; background: #fff; }
    canvas.chart { display: block; width: 100%; height: 100%; min-height: 0; background: #fff; }
    .chart-tooltip {
      position: fixed;
      z-index: 1000;
      display: none;
      pointer-events: none;
      padding: 6px 8px;
      border: 1px solid #334155;
      border-radius: 3px;
      background: rgba(17, 24, 39, .95);
      color: #fff;
      font: 12px Consolas, "Microsoft JhengHei", monospace;
      line-height: 1.45;
      white-space: pre;
      box-shadow: 0 4px 12px rgba(15, 23, 42, .22);
    }
    .single-layout { height: 100%; display: grid; grid-template-rows: 42px minmax(0, 1fr); }
    .single-ctrl {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px;
      background: #f0f3f8;
      border-bottom: 1px solid #d3dbe5;
    }
    .single-ctrl label { font-size: 14px; }
    #nudWaferNo { width: 80px; height: 28px; }
    #btnLoadWafer, #btnOpenSingle {
      height: 28px;
      border: 1px solid #aeb9c7;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      padding: 0 12px;
    }
    #txtSingleFile {
      flex: 1;
      min-width: 160px;
      height: 28px;
      border: 1px solid #aeb9c7;
      padding: 3px 6px;
      background: #fff;
    }
    .subtabs { height: 100%; display: grid; grid-template-rows: 29px minmax(0, 1fr); }
    .subtabstrip { display: flex; align-items: end; padding: 5px 4px 0; border-bottom: 1px solid #aaa; background: #f4f4f4; }
    .subtab { width: 95px; height: 24px; border: 1px solid #aaa; border-bottom: 0; background: #ebebeb; cursor: pointer; }
    .subtab.active { background: #fff; font-weight: 800; }
    .subpage { display: none; min-height: 0; }
    .subpage.active { display: block; }
    .wear { height: 100%; display: grid; grid-template-rows: 28px minmax(0, 1fr); }
    .wearinfo { display: flex; align-items: center; padding-left: 6px; background: #f0f3f8; border-bottom: 1px solid #d3dbe5; font: 13px Consolas, monospace; }
    .s1check { height: 100%; display: grid; grid-template-rows: 286px minmax(0, 1fr); background: #fff; }
    .s1summary { display: flex; align-items: center; align-content: center; flex-wrap: wrap; gap: 6px 10px; height: 88px; padding: 0 8px; background: #f0f3f8; border-bottom: 1px solid #d3dbe5; font: 13px Consolas, "Microsoft JhengHei", monospace; }
    .s1summary span { flex: 1 1 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .s1summary label { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font: 13px "Microsoft JhengHei UI", Arial; }
    .s1summary input { width: 64px; height: 23px; box-sizing: border-box; border: 1px solid #9aa8ba; padding: 1px 5px; font: 13px Consolas, monospace; }
    .s1summary input[type="checkbox"] { width: auto; height: auto; margin: 0 4px 0 0; }
    .s1summary button { height: 24px; padding: 1px 12px; border: 1px solid #9aa8ba; background: linear-gradient(#fff, #e8edf4); color: #111827; font: 13px "Microsoft JhengHei UI", Arial; cursor: pointer; }
    #btnS1Sample { border-color: #2563eb; background: linear-gradient(#3b82f6, #1d4ed8); color: #fff; font-weight: 800; }
    #btnS1Sample:hover { background: linear-gradient(#60a5fa, #2563eb); }
    #btnS1PeakPPT { border-color: #b45309; background: linear-gradient(#f59e0b, #c2410c); color: #fff; font-weight: 800; }
    #btnS1PeakPPT:hover:not(:disabled) { background: linear-gradient(#fbbf24, #d97706); }
    .s1summary button:disabled { opacity: .55; cursor: not-allowed; }
    .s1progress { width: 100%; height: 8px; display: none; appearance: none; border: 0; background: #d8e1ec; }
    .s1progress::-webkit-progress-bar { background: #d8e1ec; }
    .s1progress::-webkit-progress-value { background: #0b83d8; }
    .s1progress::-moz-progress-bar { background: #0b83d8; }
    .s1check > div:first-child { min-height: 0; overflow: hidden; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
    .s1results { height: 100%; min-height: 0; overflow-y: auto; overflow-x: auto; scrollbar-gutter: stable; border-bottom: 1px solid #c8d0da; }
    .s1results tr { cursor: pointer; }
    .s1results tr.active td { background: #dbeafe; }
    .s1chartwrap { display: grid; grid-template-rows: 26px minmax(0, 1fr); min-height: 0; }
    .s1charttitle { display: flex; align-items: center; gap: 8px; padding: 0 8px; background: #fff; color: #111827; font: 13px Consolas, "Microsoft JhengHei", monospace; }
    .s1charttitle span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; }
    .chartzoom { display: flex; gap: 4px; flex: 0 0 auto; }
    .chartzoom button { min-width: 32px; height: 24px; border: 1px solid #9aa6b5; background: #f7f9fc; color: #111827; cursor: pointer; }
    .s1folder-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, .42);
    }
    .s1folder-modal.show { display: flex; }
    .s1folder-dialog {
      width: min(760px, 96vw);
      height: min(560px, 90vh);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(15, 23, 42, .28);
      overflow: hidden;
    }
    .s1folder-head {
      padding: 12px 14px 8px;
      border-bottom: 1px solid #d5dde7;
      background: #f8fafc;
    }
    .s1folder-title { margin: 0 0 5px; font-size: 17px; font-weight: 800; }
    .s1folder-help { color: #475569; font-size: 13px; }
    .s1folder-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #eef3f8;
      border-bottom: 1px solid #d5dde7;
      font-size: 13px;
    }
    .s1folder-root {
      flex: 1 1 260px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-family: Consolas, "Microsoft JhengHei", monospace;
    }
    .s1folder-bar button, .s1folder-foot button {
      height: 28px;
      border: 1px solid #9aa8ba;
      border-radius: 3px;
      background: linear-gradient(#fff, #e8edf4);
      cursor: pointer;
      padding: 0 12px;
    }
    .s1folder-tree {
      min-height: 0;
      overflow: auto;
      padding: 8px 10px;
      font: 13px Consolas, "Microsoft JhengHei", monospace;
    }
    .s1folder-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 26px;
      padding: 2px 6px 2px calc(8px + var(--depth, 0) * 18px);
      border-radius: 3px;
    }
    .s1folder-row:hover { background: #eff6ff; }
    .s1folder-row label {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
    }
    .s1folder-row input { flex: 0 0 auto; }
    .s1folder-row .name { overflow: hidden; text-overflow: ellipsis; }
    .s1folder-count { color: #64748b; font-size: 12px; white-space: nowrap; }
    .s1folder-empty { padding: 18px; color: #64748b; }
    .s1folder-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #d5dde7;
      background: #f8fafc;
    }
    #btnS1FolderStart {
      border-color: #047857;
      background: linear-gradient(#10b981, #047857);
      color: #fff;
      font-weight: 800;
    }
    #btnS1FolderCancel { min-width: 72px; }
    .ai { height: 100%; display: grid; grid-template-rows: 42px minmax(0, 1fr); }
    .ai textarea { width: 100%; height: 100%; border: 0; padding: 8px; resize: none; font-family: Consolas, "Microsoft JhengHei", monospace; }
    .ai input, .ai select { height: 28px; border: 1px solid #aeb9c7; padding: 3px 6px; }
    .hidden { display: none; }
    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; grid-template-rows: auto 24px minmax(520px, 1fr); }
      .topbar { height: 110px; }
      #btnWafer { left: 151px; }
      #btnPPT { left: 6px; top: 58px; }
      #btnS1Peak { left: 151px; top: 58px; }
      #btnLangZhTW { left: 300px; top: 66px; }
      #btnLangZhCN { left: 362px; top: 66px; }
      #btnLangEn { left: 424px; top: 66px; }
      #btnAbout { left: 486px; top: 66px; }
      #lblPath { left: 518px; right: 8px; top: 66px; }
      #lblVersion { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button id="btnBatch" class="mainbtn">📁  批次分析</button>
      <button id="btnWafer" class="mainbtn">📄  單片 Wafer</button>
      <button id="btnPPT" class="mainbtn" disabled>📊  產出 PPT</button>
      <button id="btnS1Peak" class="mainbtn">S1 peak檢查</button>
      <button id="btnLangZhTW" class="langbtn active">繁中</button>
      <button id="btnLangZhCN" class="langbtn">簡中</button>
      <button id="btnLangEn" class="langbtn">EN</button>
      <button id="btnAbout">?</button>
      <div id="lblPath">尚未載入</div>
      <div id="lblVersion">v1.8.27</div>
      <input id="folderInput" class="hidden" type="file" webkitdirectory directory multiple>
      <input id="singleFileInput" class="hidden" type="file" accept=".csv,.ini">
      <input id="s1PeakInput" class="hidden" type="file" webkitdirectory directory multiple>
    </div>
    <div id="lblInfo" class="info">—</div>
    <div class="tabs">
      <div class="tabstrip" id="tabstrip">
        <button class="tab active" data-tab="params">加工參數</button>
        <button class="tab" data-tab="removal">移除量</button>
        <button class="tab" data-tab="postlift">抬針後移除量</button>
        <button class="tab" data-tab="loading">負載狀況</button>
        <button class="tab" data-tab="loaddist">負載分布</button>
        <button class="tab" data-tab="loadseq">負載時序串聯</button>
        <button class="tab" data-tab="loadpar">負載時序並聯</button>
        <button class="tab" data-tab="time">加工時間</button>
        <button class="tab" data-tab="wear">平均磨耗率</button>
        <button class="tab" data-tab="thickness">成品厚度</button>
        <button class="tab" data-tab="single">單片分析</button>
        <button class="tab" data-tab="ai">優化建議</button>
        <button class="tab" data-tab="s1check">S1 peak檢查</button>
      </div>

      <main>
        <section id="params" class="page active"><div class="tablewrap" id="dgvParams"></div></section>
        <section id="removal" class="page"><div class="split-v"><div class="chartbox"><canvas id="chtRemoval" class="chart"></canvas></div><div class="tablewrap" id="dgvRemovalStats"></div></div></section>
        <section id="postlift" class="page"><div class="chartbox"><canvas id="chtPostLift" class="chart"></canvas></div></section>
        <section id="loading" class="page">
          <div class="ctrlbar">
            <label class="toggle"><input id="chkLoadChuck1" type="checkbox" checked> Chuck 1</label>
            <label class="toggle c2"><input id="chkLoadChuck2" type="checkbox" checked> Chuck 2</label>
            <label class="toggle c3"><input id="chkLoadChuck3" type="checkbox" checked> Chuck 3</label>
            <label class="toggle purple"><input id="chkLoadOverall" type="checkbox"> G1 / G2 總覽</label>
          </div>
          <div class="split-half" style="height:calc(100% - 36px)"><div class="chartbox"><canvas id="chtLoadingG1" class="chart"></canvas></div><div class="chartbox"><canvas id="chtLoadingG2" class="chart"></canvas></div></div>
        </section>
        <section id="loaddist" class="page"><div class="chartbox"><canvas id="chtLoadingDist" class="chart"></canvas></div></section>
        <section id="loadseq" class="page"><div class="split-half"><div class="chartbox"><canvas id="chtLoadingSeqG1" class="chart"></canvas></div><div class="chartbox"><canvas id="chtLoadingSeqG2" class="chart"></canvas></div></div></section>
        <section id="loadpar" class="page">
          <div class="ctrlbar">
            <label class="toggle purple"><input id="chkParSmooth" type="checkbox"> 平滑化</label>
            <label class="toggle"><input class="chkPar" value="1" type="checkbox" checked> W1</label>
            <label class="toggle"><input class="chkPar" value="2" type="checkbox" checked> W2</label>
            <label class="toggle"><input class="chkPar" value="3" type="checkbox" checked> W3</label>
            <label class="toggle"><input class="chkPar" value="4" type="checkbox" checked> W4</label>
            <label class="toggle"><input class="chkPar" value="5" type="checkbox" checked> W5</label>
            <label class="toggle"><input class="chkPar" value="6" type="checkbox" checked> W6</label>
          </div>
          <div class="split-half" style="height:calc(100% - 36px)"><div class="chartbox"><canvas id="chtLoadingParG1" class="chart"></canvas></div><div class="chartbox"><canvas id="chtLoadingParG2" class="chart"></canvas></div></div>
        </section>
        <section id="time" class="page"><div class="chartbox"><canvas id="chtTime" class="chart"></canvas></div></section>
        <section id="wear" class="page"><div class="wear"><div id="lblWearInfo" class="wearinfo">—</div><div class="split-half"><div class="chartbox"><canvas id="chtWearG1Full" class="chart"></canvas></div><div class="chartbox"><canvas id="chtWearG2Full" class="chart"></canvas></div></div></div></section>
        <section id="thickness" class="page">
          <div class="ctrlbar">
            <label class="toggle"><input id="chkThickG1" type="checkbox" checked> G1 研磨後厚度</label>
            <label class="toggle c2"><input id="chkThickG2" type="checkbox" checked> G2 成品厚度</label>
          </div>
          <div class="chartbox" style="height:calc(100% - 36px)"><canvas id="chtThickness" class="chart"></canvas></div>
        </section>
        <section id="single" class="page">
          <div class="single-layout">
            <div class="single-ctrl">
              <label id="lblWaferNo" for="nudWaferNo">晶片號碼：</label>
              <input id="nudWaferNo" type="number" min="1" max="9999" value="1">
              <button id="btnLoadWafer">從批次載入</button>
              <label id="lblOrFile">或直接開啟：</label>
              <input id="txtSingleFile" readonly>
              <button id="btnOpenSingle">瀏覽...</button>
            </div>
            <div class="subtabs">
              <div class="subtabstrip"><button class="subtab active" data-sub="singleG1">G1  粗磨</button><button class="subtab" data-sub="singleG2">G2  細磨</button></div>
              <div id="singleG1" class="subpage active chartbox"><canvas id="chtSingleG1" class="chart"></canvas></div>
              <div id="singleG2" class="subpage chartbox"><canvas id="chtSingleG2" class="chart"></canvas></div>
            </div>
          </div>
        </section>
        <section id="ai" class="page">
          <div class="ai">
            <div class="ctrlbar">
              <label>AI 服務：</label><select id="cboProvider"><option>Google Gemini</option><option>Anthropic Claude</option><option>OpenRouter</option></select>
              <label>API Key：</label><input id="txtApiKey" type="password">
              <button id="btnSaveKey">儲存金鑰</button>
              <button id="btnClearKey">清除金鑰</button>
              <button id="btnGenAI">產生 AI 建議</button>
              <span id="lblAIStatus">就緒</span>
            </div>
            <textarea id="rtbAI"></textarea>
          </div>
        </section>
        <section id="s1check" class="page">
          <div class="s1check">
            <div>

    function parseProcessCsv(text, fileCount = 0) {

    }
    function parseWheelRow(cols, g1, info) { const p = g1 ? "g1" : "g2"; info[`${p}WheelID`] = cols[1] || ""; info[`${p}TotalWear`] = num(cols[4]); info[`${p}PcsOK`] = int(cols[5]); info[`${p}PcsNG`] = int(cols[6]); info[`${p}DressCount`] = int(cols[7]); info[`${p}AvgWear`] = num(cols[9]); info[`${p}PcsGrind`] = int(cols[10]); }
    function parseRecipeCsv(lines, start, g1, info) { const p = g1 ? "g1" : "g2"; const par = csvSplit(lines[start + 2] || ""), s1 = csvSplit(lines[start + 4] || ""), s2 = csvSplit(lines[start + 5] || ""); info[`${p}TotalStep`] = int(par[7]); info[`${p}FinalTarget`] = num(par[8]); info[`${p}AirCut`] = num(par[9]); info[`${p}SparkOut`] = num(par[12]); info[`${p}EscapeCutDist`] = num(par[15]); info[`${p}EscapeCutFeed`] = num(par[16]); info[`${p}SpindleSpeed`] = num(s1[1]); info[`${p}WorkpieceSpeed`] = num(s1[2]); info[`${p}FeedRate1`] = num(s1[3]); info[`${p}RemoveValue1`] = num(s1[10]); info[`${p}FeedRate2`] = num(s2[3]); info[`${p}RemoveValue2`] = num(s2[10]); }

    function parseWheelIni(a, g1, info) { const p = g1 ? "g1" : "g2"; info[`${p}TotalWear`] = num(at(a, 2)); info[`${p}PcsOK`] = int(at(a, 3)); info[`${p}PcsNG`] = int(at(a, 4)); info[`${p}DressCount`] = int(at(a, 5)); info[`${p}AvgWear`] = num(at(a, 7)); info[`${p}PcsGrind`] = int(at(a, 8)); }
    function parseRecipeIni(ini, sec, g1, info) { const p = g1 ? "g1" : "g2"; const s0 = parts(iniGet(ini, sec, "Step0")), s1 = parts(iniGet(ini, sec, "Step1")), s2 = parts(iniGet(ini, sec, "Step2")); info[`${p}TotalStep`] = int(at(s0, 6)); info[`${p}FinalTarget`] = num(at(s0, 7)); info[`${p}AirCut`] = num(at(s0, 8)); info[`${p}SparkOut`] = num(at(s0, 11)); info[`${p}EscapeCutDist`] = num(at(s0, 14)); info[`${p}EscapeCutFeed`] = num(at(s0, 15)); info[`${p}SpindleSpeed`] = num(at(s1, 0)); info[`${p}WorkpieceSpeed`] = num(at(s1, 1)); info[`${p}FeedRate1`] = num(at(s1, 2)); info[`${p}RemoveValue1`] = num(at(s1, 9)); info[`${p}FeedRate2`] = num(at(s2, 2)); info[`${p}RemoveValue2`] = num(at(s2, 9)); }

    function parseBatchCsv(text) {
      const lines = text.split("\n").filter(x => x.trim()); if (lines.length < 2) return [];
      const header = csvSplit(lines[0]); const idx = {}; header.forEach((h, i) => { idx[h.trim()] = i; idx[h.trim().replace(/\s*\(.*?\)\s*$/, "")] = i; });
      const alias = { G1_WaferNum:"G1_Wafer",G1_ChuckNum:"G1_Chuck",G1_T2:"G1_T2Pos",G1_TarSV:"G1_TargetSV",G1_TarPV:"G1_TargetPV",G1_LaMin:"G1_LastWaferMin",G1_S1Peak:"G1_PeakS1",G1_S2Peak:"G1_PeakS2",G1_ZPeak:"G1_PeakZ",G2_WaferNum:"G2_Wafer",G2_ChuckNum:"G2_Chuck",G2_T2:"G2_T2Pos",G2_TarSV:"G2_TargetSV",G2_TarPV:"G2_TargetPV",G2_LaMin:"G2_LastWaferMin",G2_S1Peak:"G2_PeakS1",G2_S2Peak:"G2_PeakS2",G2_ZPeak:"G2_PeakZ" };
      for (const [o, n] of Object.entries(alias)) if (idx[o] != null && idx[n] == null) idx[n] = idx[o];
      const get = (c, k) => c[idx[k]] ?? "";
      return lines.slice(1).map(line => { const c = csvSplit(line), r = {}; for (const g of ["G1","G2"]) { const p = g.toLowerCase(); r[`${p}Wafer`] = int(get(c, `${g}_Wafer`)); r[`${p}Chuck`] = int(get(c, `${g}_Chuck`)); r[`${p}Income`] = num(get(c, `${g}_Income`)); r[`${p}TargetSV`] = num(get(c, `${g}_TargetSV`)); r[`${p}TargetPV`] = num(get(c, `${g}_TargetPV`)); r[`${p}LastWaferMin`] = num(get(c, `${g}_LastWaferMin`)); r[`${p}PeakS1`] = num(get(c, `${g}_PeakS1`)); r[`${p}PeakS2`] = num(get(c, `${g}_PeakS2`)); r[`${p}PeakZ`] = num(get(c, `${g}_PeakZ`)); r[`${p}SWear`] = num(get(c, `${g}_SWear`)); r[`${p}TWear`] = num(get(c, `${g}_TWear`)); r[`${p}Result`] = String(get(c, `${g}_Result`) || "").trim(); r[`${p}StartTime`] = parseDate(get(c, `${g}_StartTime`)); r[`${p}EndTime`] = parseDate(get(c, `${g}_EndTime`)); } enrichRecord(r); return r; }).filter(r => r.g1Wafer || r.g2Wafer);

    async function parseBatchIniFromFiles() { const plog = findFile("processlog.ini"); let cancel = [false, false]; if (plog) { const ini = parseIni(await readFileText(plog)); const s0 = parts(iniGet(ini, "NC3", "Step0")); cancel = [at(s0, 6) === "1", at(s0, 7) === "1"]; } const waferFiles = [...state.files.values()].filter(f => /^w\d+\.ini$/i.test(fileKey(f.name))).sort((a, b) => fileKey(a.name).localeCompare(fileKey(b.name))); const out = []; for (const file of waferFiles) { const ini = parseIni(await readFileText(file)); const rec = parseWaferIniRecord(ini, file.name, cancel); if (rec.g1Wafer || rec.g2Wafer) out.push(rec); } return out; }
    function parseWaferIniRecord(ini, fileName, cancel) { const rec = {}; const cass = parts(iniGet(ini, "BlockInfo", "Cassette")); const data = parts(iniGet(ini, "BlockInfo", "Data")); let wnum = int(at(cass, 2)) || int(fileKey(fileName).replace(/\D/g, "")); if (!cancel[0]) fillGrindIni(rec, ini, data, "G1", false, wnum); if (!cancel[1]) fillGrindIni(rec, ini, data, "G2", true, wnum); enrichRecord(rec); return rec; }
    function fillGrindIni(rec, ini, data, g, isG2, wnum) { const p = g.toLowerCase(); const step0 = parts(iniGet(ini, `${g}_Recipe`, "Step0")); const runSteps = int(at(step0, 6)); const before = parts(iniGet(ini, `${g}_Wheel`, "BeforeGrd")); const after = parts(iniGet(ini, `${g}_Wheel`, `AfterGrdStep${runSteps}`)); let singleWear = 0; for (let i = 1; i <= runSteps; i++) singleWear += num(at(parts(iniGet(ini, `${g}_Wheel`, `AfterGrdStep${i}`)), 3)); const peak = parts(iniGet(ini, "BlockInfo", `${g}PeakLoading`)); const t = parts(iniGet(ini, "BlockInfo", `${g}_Time`)); const raw = at(data, isG2 ? 2 : 1); rset(rec, p, { Wafer: wnum, Chuck: int(at(data, 0)), Income: num(at(before, 12)), TargetSV: num(at(step0, 7)), TargetPV: num(at(after, 11)), LastWaferMin: num(at(before, 11)), PeakS1: num(at(peak, 0)), PeakS2: num(at(peak, 1)), PeakZ: num(at(peak, 2)), SWear: Number(singleWear.toFixed(1)), TWear: num(at(after, 4)), Result: raw === "0" ? "OK" : (raw === "1" || raw === "" ? "NG" : "PASS"), StartTime: parseDate(at(t, 0)), EndTime: parseDate(at(t, 1)) }); }
    function rset(rec, p, vals) { for (const [k, v] of Object.entries(vals)) rec[`${p}${k}`] = v; }
    function enrichRecord(r) { r.g1Removal = r.g1Income - r.g1LastWaferMin; r.g2Removal = r.g2Income - r.g2LastWaferMin; r.g1PostLift = r.g1TargetPV - r.g1LastWaferMin; r.g2PostLift = r.g2TargetPV - r.g2LastWaferMin; r.g1Sec = r.g1StartTime && r.g1EndTime ? Math.max(0, (r.g1EndTime - r.g1StartTime) / 1000) : 0; r.g2Sec = r.g2StartTime && r.g2EndTime ? Math.max(0, (r.g2EndTime - r.g2StartTime) / 1000) : 0; r.g1OK = r.g1Result === "OK"; r.g2OK = r.g2Result === "OK"; r.wafer = r.g1Wafer || r.g2Wafer; r.waitG1 = 0; r.waitG2 = 0; }
    function calculateWaits(records) { const s = [...records].sort((a, b) => (a.wafer || 0) - (b.wafer || 0)); for (let i = 1; i < s.length; i++) { const p = s[i - 1], c = s[i]; if (p.g1EndTime && c.g1StartTime) c.waitG1 = Math.max(0, (c.g1StartTime - p.g1EndTime) / 1000); if (p.g2EndTime && c.g2StartTime) c.waitG2 = Math.max(0, (c.g2StartTime - p.g2EndTime) / 1000); } }
    function calculateFallbackMetrics(info, records) { if (!info || !records.length) return; if (!info.lotWaferAmount) info.lotWaferAmount = records.length; const h = info.lotStartTime && info.lotEndTime ? (info.lotEndTime - info.lotStartTime) / 3600000 : 0; if (h > 0 && info.lotWaferAmount > 0) { info.g1UPH = info.lotWaferAmount / h; info.g2UPH = info.g1UPH; } if (!(info.g1UPH > 0)) { const ok = records.filter(r => r.g1OK && r.g1EndTime instanceof Date); const counts = new Map(); ok.forEach(r => { const d = r.g1EndTime; const k = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}-${d.getHours()}`; counts.set(k, (counts.get(k) || 0) + 1); }); const vals = [...counts.values()]; if (vals.length) { info.g1UPH = vals.reduce((a,b)=>a+b,0) / vals.length; info.g2UPH = info.g1UPH; } } const g1 = records.filter(r => r.g1Result && r.g1Result !== "NG"); if (g1.length) info.g1AvgWear = g1.reduce((s,r)=>s+(Number.isFinite(r.g1SWear)?r.g1SWear:0),0) / g1.length; const g2 = records.filter(r => r.g2Result && r.g2Result !== "NG"); if (g2.length) info.g2AvgWear = g2.reduce((s,r)=>s+(Number.isFinite(r.g2SWear)?r.g2SWear:0),0) / g2.length; }

    async function loadBatchFromFiles(files) {

      state.records = batchCsv ? parseBatchCsv(await readFileText(batchCsv)) : await parseBatchIniFromFiles();

    function parseWaferCsvData(text, fileName) { const data = { fileName, waferNumber:int(fileKey(fileName).replace(/\D/g,"")), chuck:0, g1Result:"", g2Result:"", g1Steps:[], g2Steps:[] }; let section="", waferInfoMode="", isG1=true, inStep=false, start=NaN, lastAbs=NaN, offset=0, prevEnd=0; for (const raw of text.split("\n")) { const line=raw.trimEnd(); if (!line.trim()) continue; if (/^\[.+\]$/.test(line.trim())) { section=line.trim(); waferInfoMode=""; inStep=false; start=NaN; lastAbs=NaN; offset=prevEnd; if (section.startsWith("[G1_Step")) isG1=true; if (section.startsWith("[G2_Step")) { if (isG1) prevEnd=0; isG1=false; offset=prevEnd; } continue; } const c=csvSplit(line); if (section==="[WaferInfo]") { waferInfoMode=parseWaferInfoLine(c,data,waferInfoMode); continue; } if (section.startsWith("[G1_Step") || section.startsWith("[G2_Step")) { if (c[0]==="Time") { inStep=true; continue; } if (!inStep || c.length<=9) continue; let t=parseTimeSeconds(c[0]); if (!Number.isFinite(t)) continue; t=unwrapTimeSeconds(t,lastAbs); lastAbs=t; if (!Number.isFinite(start)) start=t; const rec=stepRecord(c,t-start+offset); rec.timestampSec=t; prevEnd=rec.relativeSec; (isG1?data.g1Steps:data.g2Steps).push(rec); } } fixRelative(data.g1Steps); fixRelative(data.g2Steps); return data; }

    function fillWaferSummaryIni(ini,g,data){const p=g.toLowerCase();const s0=parts(iniGet(ini,`${g}_Recipe`,"Step0"));const steps=int(at(s0,6));const before=parts(iniGet(ini,`${g}_Wheel`,"BeforeGrd"));const after=parts(iniGet(ini,`${g}_Wheel`,`AfterGrdStep${steps}`));data[`${p}TargetSV`]=num(at(s0,7));data[`${p}Income`]=num(at(before,12));data[`${p}LastWaferMin`]=num(at(before,11));data[`${p}TargetPV`]=num(at(after,11));}
    function fillWaferStepsIni(ini,g,out){const steps=int(at(parts(iniGet(ini,`${g}_Recipe`,"Step0")),6));let prevEnd=0;for(let step=1;step<=steps;step++){const sec=ini[`${g}_Step${step}`];if(!sec)continue;const count=int(sec["0"]);let start=NaN,lastAbs=NaN;const offset=prevEnd;for(let k=1;k<=count;k++){const row=sec[String(k)];if(!row)continue;const c=csvSplit(row);let t=parseTimeSeconds(c[0]);if(!Number.isFinite(t))continue;t=unwrapTimeSeconds(t,lastAbs);lastAbs=t;if(!Number.isFinite(start))start=t;const rec=stepRecord(c,t-start+offset);rec.timestampSec=t;prevEnd=rec.relativeSec;out.push(rec);}}}

    function detectS1PeakAnomalies(points,minDelta=s1PeakDeltaValue(),rapidSlope=s1RapidSlopeValue(),slowSlope=s1SlopeValue()){

    function waitUiPaint(){return new Promise(resolve=>(window.requestAnimationFrame||setTimeout)(resolve,0));}

    function s1RemainingText(startedAt,done,total){

    }
    async function updateS1PeakScanProgress(stats,force=false){

    function s1FolderRoots(files){
      const roots=[];

    function s1FolderLabel(files){

    function s1FileFolderPath(file){

    function s1BuildFolderChoices(files){

        const folder=s1FileFolderPath(f)||s1FileRelativePath(f).split("/")[0]||"";
        for(const p of s1ParentFolders(folder))folders.add(p);
      }
      const choices=[...folders].sort((a,b)=>a.localeCompare(b)).map(path=>{
        const directName=path.split("/").filter(Boolean).pop()||path;
        const count=waferFiles.filter(f=>{
          const folder=s1FileFolderPath(f)||s1FileRelativePath(f).split("/")[0]||"";
          return folder===path||folder.startsWith(path+"/");

        return {path,name:directName,depth:Math.max(0,path.split("/").length-1),count};

    function s1FilesInSelectedFolders(files,folders){

    function addS1PeakFolderSelection(list){

        const name=Array.isArray(item)?item[0]:(entry&&entry.name)||"";

    function s1PeakZoomOptions(series,item){
      const pts=series.flatMap(s=>s.points||[]).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y));
      if(!pts.length)return{xMin:0};
      const fullMin=0,fullMax=Math.max(...pts.map(p=>p.x),1),zoom=Math.max(1,Math.min(12,state.s1PeakCheck.zoom||1));
      if(zoom<=1.0001)return{xMin:0};
      const seg=s1SlopeSegment(series,item),fullSpan=Math.max(1,fullMax-fullMin);
      let span=Math.max(5,fullSpan/zoom),center=Number.isFinite(item.sec)?item.sec:(fullMin+fullMax)/2;
      if(seg){
        const segSpan=Math.abs(seg.end.x-seg.start.x);
        span=Math.max(span,segSpan*1.35+2);
        center=(seg.start.x+seg.end.x)/2;
      }
      let xMin=Math.max(fullMin,center-span/2),xMax=Math.min(fullMax,center+span/2);
      if(xMax-xMin<span){if(xMin<=fullMin)xMax=Math.min(fullMax,fullMin+span);else if(xMax>=fullMax)xMin=Math.max(fullMin,fullMax-span);}
      const visible=pts.filter(p=>p.x>=xMin&&p.x<=xMax);
      if(visible.length){
        let yMin=min(visible.map(p=>p.y)),yMax=max(visible.map(p=>p.y));
        if(yMin===yMax){yMin-=1;yMax+=1;}
        const pad=Math.max((yMax-yMin)*.18,.4);
        return{xMin,xMax,yMin:Math.max(0,yMin-pad),yMax:yMax+pad};
      }
      return{xMin,xMax};
    }

    $("folderInput").addEventListener("change", async e=>{try{$("lblPath").textContent="Loading...";await loadBatchFromFiles([...e.target.files]);}catch(err){alert(err.message||String(err));$("lblPath").textContent=tr[state.lang].notLoaded;}});
    $("singleFileInput").addEventListener("change", e=>loadSingleWafer(e.target.files[0]).catch(err=>alert(err.message||String(err))));
    $("s1PeakInput").addEventListener("change", e=>{
      const added=addS1PeakFolderSelection(e.target.files);
      $("s1PeakInput").value="";
      if(!added&&s1PeakPendingFiles.length===0)return;
      const roots=s1FolderRoots(s1PeakPendingFiles);
      if(roots.length===1)saveS1LastRootName(roots[0]);
      showS1FolderPicker(s1PeakPendingFiles);
    });
    $("btnOpenSingle").addEventListener("click", ()=>$("singleFileInput").click());
    $("btnLoadWafer").addEventListener("click", ()=>loadWaferFromBatch().catch(err=>alert(err.message||String(err))));
    document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>activateTab(b.dataset.tab)));
    $("dgvS1PeakResults").addEventListener("click",e=>{const tr=e.target.closest("tr[data-s1idx]");if(tr)renderS1PeakChart(int(tr.dataset.s1idx));});
    document.querySelectorAll(".subtab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".subtab").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".subpage").forEach(p=>p.classList.toggle("active",p.id===b.dataset.sub));setTimeout(renderSingleWaferCharts,35);}));
    ["chkLoadChuck1","chkLoadChuck2","chkLoadChuck3","chkLoadOverall","chkThickG1","chkThickG2"].forEach(id=>$(id).addEventListener("change",renderAll));

    $("btnLangEn").addEventListener("click",()=>{applyLanguage("en");setTimeout(renderSingleWaferCharts,35);});

    restoreS1PeakSettings();
    setStaticLanguage();
