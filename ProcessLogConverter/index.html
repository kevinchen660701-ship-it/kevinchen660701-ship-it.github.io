<!doctype html>
<html lang="zh-Hant">
<head>
  <!-- auth-gateway:start -->
  <style>html.auth-pending{visibility:hidden}</style>
  <script>
    (function () {
      var host = String(location.hostname || "").toLowerCase();
      if (host === "kevinchen660701-ship-it.github.io") {
        document.documentElement.classList.add("auth-pending");
        var script = document.createElement("script");
        script.src = "https://site-auth-gateway.cloudflare-authgateway.workers.dev/auth-check.js";
        script.defer = true;
        script.setAttribute("data-site", "ProcessLogConverter");
        document.head.appendChild(script);
      }
    })();
  </script>
  <!-- auth-gateway:end -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSG-2300 ProcessLog Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="window" aria-label="FSG-2300 ProcessLog Converter">
    <button id="selectFolderButton" class="button select-button" type="button">選取資料夾</button>
    <button id="convertButton" class="button convert-button" type="button">轉換檔案</button>
    <button id="cancelButton" class="button cancel-button" type="button" hidden disabled>取消</button>
    <button id="releaseNoteButton" class="button release-button" type="button">Release Note</button>
    <div id="versionLabel" class="label version-label">版本：1.4.16.0</div>

    <div id="sourceFolderLabel" class="label source-label">來源資料夾：未選取</div>
    <div id="outputFolderLabel" class="label output-label">輸出資料夾：未選取</div>

    <progress id="progressBar" class="progress" value="0" max="100"></progress>
    <div id="remainTimeLabel" class="label remain-label">預估剩餘時間：--:--:--</div>
    <div id="statusLabel" class="label status-label">請先選取根目錄，下一步可勾選要轉換的 ProcessLog 資料夾</div>
  </main>

  <input id="folderInput" type="file" webkitdirectory multiple hidden>

  <dialog id="releaseNoteDialog" class="note-dialog">
    <div class="note-text" id="releaseNoteText"></div>
    <button id="closeReleaseNoteButton" class="button note-close-button" type="button">關閉</button>
  </dialog>

  <dialog id="loadingDialog" class="loading-dialog">
    <div class="loading-title">讀取中</div>
    <div id="loadingMessage" class="loading-message">正在載入資料夾...</div>
    <progress id="loadingProgress" class="loading-progress"></progress>
  </dialog>

  <dialog id="folderSelectionDialog" class="folder-dialog">
    <div class="folder-title">選擇 ProcessLog 資料夾</div>
    <div id="folderSelectionRoot" class="folder-root">根目錄：尚未選擇</div>
    <div id="folderSelectionSummary" class="folder-summary">已勾選 0 / 0 個資料夾，Wafer 0 筆</div>
    <div id="folderSelectionList" class="folder-list"></div>
    <button id="folderSelectAllButton" class="button folder-select-all-button" type="button">全選</button>
    <button id="folderClearButton" class="button folder-clear-button" type="button">清除</button>
    <button id="folderConfirmButton" class="button folder-confirm-button" type="button">確定</button>
    <button id="folderCancelButton" class="button folder-cancel-button" type="button">取消</button>
  </dialog>

  <script src="app.js?v=20260828-1910"></script>
</body>
</html>
